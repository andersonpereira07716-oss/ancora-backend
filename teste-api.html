<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Âncora - Teste de API</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-box {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
      animation: slideIn 0.3s ease-in;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.user .bubble {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #e9ecef;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message.system .bubble {
      background: #ffeaa7;
      color: #d63031;
      font-weight: bold;
      justify-content: center;
    }

    .input-area {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      background: #764ba2;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 6px;
      margin-top: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #27ae60;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status.error .status-dot {
      background: #e74c3c;
      animation: none;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quick-btn {
      padding: 10px;
      background: #ecf0f1;
      color: #333;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: #bdc3c7;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 10px;
      color: #667eea;
      font-size: 12px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌊 Âncora</h1>
      <p>Teste a API do Backend</p>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Digite sua mensagem..." 
          onkeypress="handleKeyPress(event)"
        >
        <button onclick="sendMessage()" id="sendBtn">Enviar</button>
      </div>

      <div class="quick-buttons">
        <button class="quick-btn" onclick="sendQuickMessage('Como você pode me ajudar?')">❓ Como ajudar?</button>
        <button class="quick-btn" onclick="sendQuickMessage('Estou me sentindo ansioso')">😟 Ansioso</button>
        <button class="quick-btn" onclick="sendQuickMessage('Tenho medo')">😨 Medo</button>
        <button class="quick-btn" onclick="sendQuickMessage('Estou triste')">😢 Triste</button>
      </div>

      <div class="status" id="status">
        <div class="status-dot"></div>
        <span id="statusText">Conectado ao servidor</span>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div> Aguardando resposta...
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/chat';
    let messages = [];

    async function checkHealth() {
      try {
        const response = await fetch('http://localhost:3000/health');
        if (response.ok) {
          updateStatus(true, 'Conectado ao servidor ✓');
          return true;
        }
      } catch (error) {
        updateStatus(false, 'Servidor indisponível ✗');
        return false;
      }
    }

    function updateStatus(connected, text) {
      const status = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      statusText.textContent = text;
      
      if (!connected) {
        status.classList.add('error');
      } else {
        status.classList.remove('error');
      }
    }

    function addMessage(role, content) {
      const chatBox = document.getElementById('chatBox');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      
      messageDiv.appendChild(bubble);
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      
      messages.push({ role, content });
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      
      if (!message) return;

      const sendBtn = document.getElementById('sendBtn');
      const loading = document.getElementById('loading');
      
      sendBtn.disabled = true;
      loading.classList.add('active');
      
      addMessage('user', message);
      input.value = '';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) {
          const error = await response.json();
          addMessage('system', `Erro: ${error.erro || 'Erro desconhecido'}`);
          return;
        }

        const data = await response.json();
        addMessage('assistant', data.resposta);

      } catch (error) {
        addMessage('system', `Erro de conexão: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
        loading.classList.remove('active');
        input.focus();
      }
    }

    function sendQuickMessage(msg) {
      document.getElementById('messageInput').value = msg;
      sendMessage();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // Verifica conexão ao carregar
    window.addEventListener('load', () => {
      checkHealth();
      document.getElementById('messageInput').focus();
    });
  </script>
</body>
</html>
